syntax = "proto3";
package Ricart_Argawala;

option go_package = "Ricart_Argawala/grpc;pb";

import "google/protobuf/empty.proto";

service node {
    rpc RecieveMessage(MessageRequest) returns (google.protobuf.Empty);
}

message MessageRequest {
    string senderId = 1;
    int64 lamport = 2;
}

